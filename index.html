<!DOCTYPE html>
<html class="light" lang="en">
<head>
    <meta charset="utf-8">
    <meta content="width=device-width, initial-scale=1.0" name="viewport">
    <title>Everyday Cooking</title>
    <link href="https://fonts.googleapis.com" rel="preconnect">
    <link crossorigin href="https://fonts.gstatic.com" rel="preconnect">
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Epilogue:wght@600;700&family=Plus+Jakarta+Sans:wght@400;600&display=swap" rel="stylesheet">
    <link href="style.css" rel="stylesheet">
    <script defer src="script.js"></script>
</head>
<body>
    <!-- TopNavBar -->
    <header class="site-header">
    <div class="top-nav">
        <div class="nav-actions nav-actions-left">
        <!-- <button class="icon-button" type="button" aria-label="Search">
            <span class="material-symbols-outlined">search</span>
        </button> -->
            <div class="search-wrapper">
                <button 
                    class="icon-button"
                    id="search-button"
                    type="button" 
                    aria-label="Search"
                    aria-haspopup="true"
                    aria-expanded="false"
                    aria-controls="search-menu"
                >
                    <span class="material-symbols-outlined">search</span>
                </button>

                <div class="search-popup" aria-controls="search-group" role="search" hidden>
                    <label class="sr-only" for="site-search">Search recipes</label>
                    <span class="material-symbols-outlined search-popup-icon">search</span>
                    <input
                        class="search-input"
                        id="site-search"
                        name="search"
                        type="search"
                        placeholder="Search recipes"
                    >
                    <button class="search-close-button" id="search-close-button" type="button" aria-label="Close search">
                        <span class="material-symbols-outlined">close</span>
                    </button>
                </div>
            </div>
        </div>

        <div class="site-title">Everyday Cooking</div>

        <div class="nav-actions nav-actions-right">
            <div class="menu-wrapper">
                <button 
                    class="icon-button"
                    id="menu-button"
                    type="button" 
                    aria-label="Menu"
                    aria-haspopup="true"
                    aria-expanded="false"
                    aria-controls="main-submenu"
                >
                    <span class="material-symbols-outlined">menu</span>
                </button>

                <nav class="submenu" id="main-submenu" aria-label="Main menu" hidden>
                    <a href="#">Breakfast</a>
                    <a href="#">Lunch</a>
                    <a href="#">Dinner</a>
                    <!-- <a href="#">Desserts</a> -->

                    <details class="submenu-group">
                        <summary>Desserts</summary>

                        <div class="submenu-nested">
                            <a href="#">Cakes</a>
                            <a href="#">Muffins</a>
                            <a href="#">Cookies</a>
                        </div>
                    </details>
                    <!-- <a href="#">Newsletter</a> -->
                </nav>
                </div>
            </div>
        </div>
    </header>

    <!-- Main Content -->
    <main class="main-content">
    <!-- Category Bento Grid -->
    <section class="category-grid">
        <!-- Breakfast -->
        <a class="category-card" href="#">
        <div class="category-overlay"></div>
        <img
            class="category-image"
            alt="Fruity breakfast"
            src="imgs/breakfast.jpg"
        >
        <div class="category-content">
            <div class="category-label">
            <h2>Breakfast</h2>
            </div>
        </div>
        </a>

        <!-- Lunch -->
        <a class="category-card category-card-offset" href="#">
        <div class="category-overlay"></div>
        <img
            class="category-image"
            alt="Refreshing lunch"
            src="imgs/lunch.jpg"
        >
        <div class="category-content">
            <div class="category-label">
            <h2>Lunch</h2>
            </div>
        </div>
        </a>

        <!-- Dinner -->
        <a class="category-card" href="#">
        <div class="category-overlay"></div>
        <img
            class="category-image"
            alt="Warm dinner"
            src="imgs/dinner.jpg"
        >
        <div class="category-content">
            <div class="category-label">
            <h2>Dinner</h2>
            </div>
        </div>
        </a>

        <!-- Desserts -->
        <a class="category-card category-card-offset" href="#">
        <div class="category-overlay"></div>
        <img
            class="category-image"
            alt="Luscious desserts"
            src="imgs/dessert.jpg"
        >
        <div class="category-content">
            <div class="category-label">
            <h2>Desserts</h2>
            </div>
        </div>
        </a>
    </section>
    </main>

    <!-- Footer -->
    <footer class="site-footer">
    <div class="footer-title">Everyday Cooking</div>
    <nav class="footer-nav">
        <a href="#">About Us</a>
        <a href="#">Privacy Policy</a>
        <a href="#">Contact</a>
        <!-- <a href="#">Newsletter</a> -->
    </nav>
    <div class="footer-copy">
        &copy; 2026 Everyday Cooking. All rights reserved.
    </div>
    </footer>
</body>
</html>
